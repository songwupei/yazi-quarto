name: zhanshi
title: 展示 — 幻灯片格式
author: songwupei
version: 0.2.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    pptx:
      reference-doc: reference.pptx
      slide-level: 2
      filters:
        - filters/lines-spacing.lua
    beamer:
      pdf-engine: xelatex
      slide-level: 2
      fontsize: 10pt
      aspectratio: 169
      include-in-header: preambles/qs-beamer-preamble.tex
      include-after: preambles/qs-beamer-after.tex
      filters:
        - filters/lines-spacing.lua
